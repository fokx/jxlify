[package]
name = "jxlify"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["tower-log"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "avif"] }
jpegxl-rs = { version = "0.15", features = ["image", "vendored"] }
jpegxl-sys = { version = "0.13", features = ["vendored"] }
zenavif = "0.1"
zenpixels-convert = { version = "0.2", features = ["rgb"] }
zenravif = "0.1"
webp = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
infer = "0.16"
mime_guess = "2.0"
woothee = "0.13"
tempfile = "3.17"
walkdir = "2.5"
blurhash = "0.2"
regex = "1.11"
jxl-encoder = "0.3"
which = "7.0"
dashmap = "6.1"
webp-animation = "0.10"
url = "2.5"
bytes = "1.6"
futures-util = "0.3"
urlencoding = "2.1"
fastrand = "2.3"
bytemuck = "1.25"
tower = { version = "0.5", features = ["util"] }
toml = "0.8"



[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
